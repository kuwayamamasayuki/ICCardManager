name: Release

on:
  push:
    tags:
      - 'v*'
  # タグを打つ前にワークフロー自体を試走するための手動実行（Issue #2116）。
  # 復元・ビルド・テスト・発行・ZIP 作成までを行い、GitHub Release の作成はタグの push に限る
  # （「Create Release」の if:）。条件を外すと、手動実行がブランチ名のリリースを公開する。手動実行ではタグを ref に
  # 選べるため、ref だけで判定すると既存タグでの試走が公開済みの Release の ZIP を差し替える（event_name も見る）。
  # 試走は main で行う（ZIP 名に github.ref_name を使うため、/ を含むブランチ名では ZIP 作成が失敗する）。
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ハングへの備えは ci.yml と同じ二段（Issue #2099 / #2116）。--blame-hang-timeout は止まったテストの名前を
  # 記録して実行を打ち切り、timeout-minutes はそれ以外（復元・ビルド・発行の停止）を止める。
  # どちらも無いと、デッドロックはジョブの既定上限（6 時間）までの停止になり、リリースが出ない理由も分からない。
  build-release:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write

    defaults:
      run:
        working-directory: ICCardManager

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore --locked-mode

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run tests
      run: dotnet test tests/ICCardManager.Tests/ICCardManager.Tests.csproj --no-build --configuration Release --verbosity normal --blame-hang-timeout 5m --blame-hang-dump-type none

    - name: Publish
      run: |
        dotnet publish src/ICCardManager/ICCardManager.csproj `
          --configuration Release `
          --no-build `
          --output ./publish

    - name: Create ZIP
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ICCardManager-${{ github.ref_name }}.zip

    - name: Extract version info
      id: version
      run: |
        $version = "${{ github.ref_name }}" -replace '^v', ''
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
      shell: pwsh

    - name: Create Release
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        name: ICCardManager ${{ steps.version.outputs.VERSION }}
        body: |
          ## 交通系ICカード管理システム：ピッすい ${{ steps.version.outputs.VERSION }}

          ### ダウンロード
          - `ICCardManager-${{ github.ref_name }}.zip` をダウンロードして展開してください
          - `ICCardManager.exe` を実行してください

          ### 動作要件
          - Windows 11
          - PaSoRi (RC-S300/RC-S380)

          ### 変更内容
          変更内容はコミットログを参照してください。
        files: |
          ICCardManager/ICCardManager-${{ github.ref_name }}.zip
        draft: false
        prerelease: ${{ contains(github.ref_name, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
