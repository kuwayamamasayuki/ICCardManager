name: Test Count Sync Check

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'ICCardManager/tests/**/*.cs'
      - 'ICCardManager/tests/**/*.csproj'
      - 'ICCardManager/docs/design/07_テスト設計書.md'
      - 'tools/check-test-count-sync.py'
      - 'tools/tests/test_check_test_count_sync.py'
      - '.github/workflows/test-count-sync-check.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'ICCardManager/tests/**/*.cs'
      - 'ICCardManager/tests/**/*.csproj'
      - 'ICCardManager/docs/design/07_テスト設計書.md'
      - 'tools/check-test-count-sync.py'
      - 'tools/tests/test_check_test_count_sync.py'
      - '.github/workflows/test-count-sync-check.yml'

# GITHUB_TOKEN の権限は読み取りだけを最上位で宣言する（Issue #2271）。宣言が無いと既定の権限（リポジトリの設定
# によっては write）で動く。書き込みが要るジョブだけが、ジョブ単位で理由を添えて広げる（CiWorkflowConventionTests が検査する）。
permissions:
  contents: read

# 同じ PR に新しいコミットが積まれたら、古いコミットの実行を取り消す。push はコミットごとに別のグループにして
# 取り消さない（理由は ci.yml の concurrency の注記）。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ジョブの上限（Issue #2116）。復元・ビルド・--list-tests が止まったときに既定の 6 時間まで待たない。
  # 通常の所要時間はビルドを含めて数分。
  test-count-sync:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SDK の確認・導入と NuGet のキャッシュは ci.yml の build-and-test と同じ（理由はそちらの注記）。
      - name: Check preinstalled .NET SDK
        id: sdk
        shell: pwsh
        run: |
          $found = $false
          try {
            dotnet --version
            $found = $LASTEXITCODE -eq 0
          } catch {
            Write-Host "dotnet が見つかりません: $_"
          }
          "found=$(if ($found) { 'true' } else { 'false' })" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit 0

      - name: Setup .NET
        if: steps.sdk.outputs.found != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('ICCardManager/**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Run Python unit tests for the check script
        shell: bash
        run: python -m unittest discover -s tools/tests -t .

      - name: Restore .NET dependencies
        working-directory: ICCardManager
        run: dotnet restore --locked-mode

      - name: Build .NET solution (Release)
        working-directory: ICCardManager
        run: dotnet build --no-restore --configuration Release

      - name: Verify test count sync (§1.1a totals and §2 per-class rows vs --list-tests)
        shell: bash
        run: |
          python tools/check-test-count-sync.py \
            --doc ICCardManager/docs/design/07_テスト設計書.md \
            --unit-csproj ICCardManager/tests/ICCardManager.Tests/ICCardManager.Tests.csproj \
            --ui-csproj ICCardManager/tests/ICCardManager.UITests/ICCardManager.UITests.csproj
