name: CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '!CLAUDE.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '!CLAUDE.md'

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ICCardManager

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run tests
      run: dotnet test --no-build --configuration Release --verbosity normal --filter "Category!=UI" --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: Upload coverage reports
      uses: codecov/codecov-action@v7
      with:
        directory: ./ICCardManager/coverage
        fail_ci_if_error: false
      continue-on-error: true

  code-quality:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ICCardManager

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Check code format
      run: dotnet format --verify-no-changes --verbosity diagnostic
      continue-on-error: true

    # ビルド警告ゼロを維持する（.claude/rules/development-conventions.md、Issue #1786）。
    # 警告を消した「手段」（NoWarn / #pragma への逃げ）は BuildWarningSuppressionConventionTests が
    # 見張るが、警告の「発生」自体を止めるゲートはここにしか置けない。
    #
    # -warnaserror は NU* / MSB* まで昇格させて CI を不安定にするため使わず、
    # コンパイラ警告行を数える方式にする。
    - name: Build with analyzers (ビルド警告ゼロを検証)
      shell: pwsh
      run: |
        $output = dotnet build --no-restore --configuration Release --nologo 2>&1 | Out-String
        Write-Host $output
        if ($LASTEXITCODE -ne 0) {
          Write-Host "::error::ビルドに失敗しました。"
          exit $LASTEXITCODE
        }

        $warnings = $output -split "`r?`n" |
          Where-Object { $_ -match ': warning ' } |
          ForEach-Object { $_.Trim() } |
          Sort-Object -Unique

        if ($warnings.Count -gt 0) {
          Write-Host "::error::ビルド警告が $($warnings.Count) 件あります。宣言側を是正するか、やむを得ない場合は csproj の NoWarn へ理由コメント付きで追加してください（.claude/rules/development-conventions.md）。"
          $warnings | ForEach-Object { Write-Host $_ }
          exit 1
        }

        Write-Host "ビルド警告 0 件"
